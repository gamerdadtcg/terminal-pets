[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./artifacts" },
]

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api" }
