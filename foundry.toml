[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./artifacts" },
]

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
# Alias so `forge script … --rpc-url testnet` resolves to Robinhood testnet (46630).
testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
# OpenSea Studio Drop dry-run (SeaDrop 1.0). Prefer Base Sepolia; Sepolia is fallback.
# Do not use these aliases for Robinhood 4663. See docs/STUDIO_DROP_DRYRUN.md.
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
# Custom Blockscout instances. `chain` lets Foundry pick the right verifier URL.
# Blockscout often accepts an empty or dummy key; CLI flags are also in docs/TESTNET_DEPLOY.md.
robinhood = { key = "${BLOCKSCOUT_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
